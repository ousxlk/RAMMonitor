name: Build RAM Monitor Desktop Widget

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt pyinstaller
      - name: Build portable desktop widget
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RAMMonitorDesktopWidget ram_monitor_desktop.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RAMMonitor-Desktop-Widget-Windows-x64
          path: dist/RAMMonitorDesktopWidget.exe
          if-no-files-found: error
