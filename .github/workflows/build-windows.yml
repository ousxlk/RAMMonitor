name: Build RAM Monitor Widget Installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Extract widget project
        shell: pwsh
        run: |
          $encoded = [regex]::Replace((Get-Content -Raw "RAMMonitorWidget-source.zip.b64"), "[^A-Za-z0-9+/=]", "").Trim()
          $bytes = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\widget.zip", $bytes)
          Expand-Archive "$env:RUNNER_TEMP\widget.zip" -DestinationPath "$env:GITHUB_WORKSPACE\source" -Force
      - name: Install dependencies
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build standalone EXE
        working-directory: source
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name RAMMonitor --collect-all pystray --collect-all PIL ram_monitor.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        working-directory: source
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc RAMMonitor.iss
          if (!(Test-Path "installer\RAMMonitorWidget-Setup-x64.exe")) { throw "Installer missing" }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RAMMonitorWidget-Installer-x64
          path: source/installer/RAMMonitorWidget-Setup-x64.exe
          if-no-files-found: error
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: RAMMonitorWidget-Portable-x64
          path: source/dist/RAMMonitor.exe
          if-no-files-found: error
